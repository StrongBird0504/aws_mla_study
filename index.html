<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLA-C01 문제풀이</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--pr:#3b5bdb;--ok:#2b8a3e;--okb:#ebfbee;--ng:#c92a2a;--ngb:#fff5f5;--hl:#fff3bf;--bd:#dfe3ea}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e2230;--tx:#e6e8ee;--mu:#9aa1b2;--bd:#323849;--okb:#1d3324;--ngb:#3a1f22;--hl:#4a3f12}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--tx)}
.w{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:18px;margin:0}.st{font-size:14px;color:var(--mu)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.qn{font-weight:700;color:var(--pr);margin-bottom:6px}.qt{line-height:1.65;white-space:pre-wrap}
.multi{display:inline-block;font-size:12px;background:var(--hl);padding:2px 8px;border-radius:10px;margin-top:6px}
.op{display:flex;gap:10px;width:100%;text-align:left;margin-top:10px;padding:12px;border:1.5px solid var(--bd);border-radius:10px;background:transparent;color:inherit;font:inherit;line-height:1.55;cursor:pointer}
.op:hover:not(:disabled){border-color:var(--pr)}.op b{min-width:20px}
.op.sel{border-color:var(--pr);background:rgba(59,91,219,.08)}
.op.ok{border-color:var(--ok);background:var(--okb)}.op.ng{border-color:var(--ng);background:var(--ngb)}
.op.ans{border-color:var(--ok);background:var(--hl);box-shadow:0 0 0 2px var(--ok) inset}
.res{margin-top:14px;padding:12px;border-radius:10px;font-weight:700}.res.ok{background:var(--okb);color:var(--ok)}.res.ng{background:var(--ngb);color:var(--ng)}
.ex{margin-top:10px;padding:12px;border-left:4px solid var(--pr);background:rgba(59,91,219,.06);line-height:1.65;white-space:pre-wrap;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button.b{padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:inherit;font:inherit;cursor:pointer}
button.b.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.b:focus-visible,.op:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
input,select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:inherit;font:inherit}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.hint{font-size:13px;color:var(--mu);margin-top:8px}
</style></head><body><div class="w">
<header><h1>AWS MLA-C01 문제풀이 (243문항)</h1><div class="st" id="st"></div></header>
<div class="bar"><i id="pg"></i></div>
<div class="tools">
<label>모드 <select id="mode"><option value="all">전체 순서</option><option value="wrong">오답만 다시</option><option value="un">안 푼 문제</option></select></label>
<label>이동 <input id="jump" type="number" min="1" max="243" style="width:80px" placeholder="번호"></label>
<button class="b" type="button" id="go">이동</button>
<button class="b" type="button" id="shuf">셔플</button>
<button class="b" type="button" id="reset">기록 초기화</button>
</div>
<div class="card" id="card"></div>
<div class="btns"><button class="b" type="button" id="prev">◀ 이전</button><button class="b p" type="button" id="next">다음 ▶</button></div>
</div>
<script src="questions.js"></script>
<script>
const Q=window.QUESTIONS,K='mla-c01-rec';let rec=JSON.parse(localStorage.getItem(K)||'{}');
let order=Q.map((_,i)=>i),pos=+(localStorage.getItem(K+'-pos')||0),pick=[],showEx=false;
const $=id=>document.getElementById(id);
const save=()=>{localStorage.setItem(K,JSON.stringify(rec));localStorage.setItem(K+'-pos',pos)};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function stats(){const v=Object.values(rec),c=v.filter(x=>x.ok).length;$('st').textContent=`풀이 ${v.length}/243 · 정답 ${c} · 오답 ${v.length-c}`+(v.length?` · 정답률 ${Math.round(c/v.length*100)}%`:'');$('pg').style.width=(v.length/243*100)+'%'}
function trLink(t){return 'https://papago.naver.com/?sk=en&tk=ko&st='+encodeURIComponent(t.slice(0,4500))}
function render(){
 if(!order.length){$('card').innerHTML='<p>해당 모드에 표시할 문제가 없습니다.</p>';stats();return}
 pos=Math.max(0,Math.min(pos,order.length-1));const q=Q[order[pos]],r=rec[q.n],done=!!r;pick=done?r.pick:[];
 const multi=q.a.length>1,hs=!Object.keys(q.o).length;
 let h=`<div class="qn">NO.${q.n} <span class="st">(${pos+1}/${order.length})</span></div><div class="qt">${esc(q.q)}</div>`;
 if(multi)h+=`<span class="multi">${q.a.length}개 선택</span>`;
 if(hs){h+=`<p class="hint">이 문항은 드래그/선택형(이미지) 문제입니다. 답을 생각한 뒤 정답을 확인하세요.</p>`;
  h+=done||showEx?`<div class="ex"><b>정답 및 해설</b>\n${esc(q.e)}</div>`:`<div class="btns"><button class="b p" type="button" id="reveal">정답 보기</button></div>`}
 else{for(const[k,v]of Object.entries(q.o)){let c='';if(done){if(q.a.includes(k))c=r.pick.includes(k)?'ok':'ans';else if(r.pick.includes(k))c='ng'}else if(pick.includes(k))c='sel';
  h+=`<button type="button" class="op ${c}" data-k="${k}" ${done?'disabled':''}><b>${k}.</b><span>${esc(v)}</span></button>`}
  if(multi&&!done)h+=`<div class="btns"><button class="b p" type="button" id="chk">정답 확인</button></div>`;
  if(done){h+=`<div class="res ${r.ok?'ok':'ng'}" aria-live="polite">${r.ok?'⭕ 정답입니다!':'❌ 오답입니다.'} 정답: ${q.a.join(', ')}</div>`;
   if(q.e){h+=`<div class="btns"><button class="b" type="button" id="exb">${showEx?'해설 숨기기':'Explanation (해설) 보기'}</button></div>`;if(showEx)h+=`<div class="ex">${esc(q.e)}</div>`}}}
 const full=q.q+'\n'+Object.entries(q.o).map(([k,v])=>k+'. '+v).join('\n');
 h+=`<p class="hint">🌐 한국어 번역: <a href="${trLink(full)}" target="_blank" rel="noopener">문제 번역</a>`+(q.e?` · <a href="${trLink(q.e)}" target="_blank" rel="noopener">해설 번역</a>`:'')+`</p>`;
 $('card').innerHTML=h;stats();save();
 $('card').querySelectorAll('.op:not([disabled])').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;
  if(!multi){grade(q,[k]);return}pick=pick.includes(k)?pick.filter(x=>x!==k):[...pick,k];$('card').querySelectorAll('.op').forEach(o=>o.classList.toggle('sel',pick.includes(o.dataset.k)))}));
 $('chk')?.addEventListener('click',()=>{if(pick.length!==q.a.length){alert(q.a.length+'개를 선택하세요');return}grade(q,pick)});
 $('exb')?.addEventListener('click',()=>{showEx=!showEx;render()});
 $('reveal')?.addEventListener('click',()=>{showEx=true;render()});
}
function grade(q,p){const ok=p.length===q.a.length&&p.every(x=>q.a.includes(x));rec[q.n]={pick:p,ok};showEx=false;render()}
function build(){const m=$('mode').value;order=Q.map((_,i)=>i).filter(i=>{const r=rec[Q[i].n];return m==='all'||(m==='wrong'?r&&!r.ok:!r)});
 if(m==='wrong')order.forEach(i=>delete rec[Q[i].n]);pos=0;showEx=false;render()}
$('mode').addEventListener('change',build);
$('prev').addEventListener('click',()=>{if(pos>0){pos--;showEx=false;render()}});
$('next').addEventListener('click',()=>{if(pos<order.length-1){pos++;showEx=false;render()}});
$('go').addEventListener('click',()=>{const n=parseInt($('jump').value,10);const i=order.findIndex(x=>Q[x].n===n);if(i<0){alert('현재 모드에 없는 번호입니다');return}pos=i;showEx=false;render()});
$('shuf').addEventListener('click',()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;showEx=false;render()});
$('reset').addEventListener('click',()=>{if(confirm('풀이 기록을 모두 지울까요?')){rec={};$('mode').value='all';build()}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
render();
</script></body></html>
